spring.application.name=equation-solver

# Render/Railway give us the port in the PORT variable; 8080 is the default for local runs
server.port=${PORT:8080}

# Swagger UI is at /swagger-ui.html and the raw OpenAPI JSON is at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
# each endpoint lists only its own responses (declared with @ApiResponses), not every handler in the advice
springdoc.override-with-generic-response=false
